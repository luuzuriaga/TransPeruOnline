    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="navbar">
    <div class="logo">
        <i class="fa-solid fa-bus"></i> TransPerú
    </div>

    <ul class="menu">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
        <li><a href="rutas.html"><i class="fa-solid fa-route"></i> Rutas</a></li>
        <li><a href="horarios.html"><i class="fa-solid fa-clock"></i> Horarios</a></li>
        <li><a href="pasajes.html"><i class="fa-solid fa-ticket"></i> Pasajes</a></li>

        
        <li>
            <a href="login.html">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </a>
        </li>

<!-- CONTENIDO -->
<div class="container">

    <div class="box box-login">

        <h1>
            <i class="fa-solid fa-magnifying-glass"></i> Buscar Pasajes
        </h1>

        <p>Encuentra tu viaje interprovincial fácilmente</p>

        <form action="pasajes.html" method="GET">

            <div class="input-box">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" placeholder="Origen" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-location-arrow"></i>
                <input type="text" placeholder="Destino" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-calendar-days"></i>
                <input type="date" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-calendar-check"></i>
                <input type="date">
            </div>

            <button type="submit" class="login">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar
            </button>

        </form>

    </div>

</div>

</body>
</html>
